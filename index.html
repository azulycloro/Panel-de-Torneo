<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneo de Natación · Panel Oficial de Resultados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  /* =====================================================================
   RESPONSIVE SIDEBAR (MÓVILES)
   ===================================================================== */
@media (max-width: 992px) {
  /* Mostrar el botón de menú hamburguesa (asegúrate de tener este botón en tu HTML) */
  .btn-menu {
    display: block !important;
  }
  /* Oculta el panel hacia la izquierda fuera de vista */
  .sidebar {
    position: fixed !important;
    top: 0;
    left: 0;
    bottom: 0;
    width: 260px;
    z-index: 1100;
    transform: translateX(-100%);
    transition: transform 0.3s ease-in-out;
  }

  /* Clase que activa la visibilidad del panel */
  .sidebar.active {
    transform: translateX(0) !important;
  }

  /* Fondo oscuro transparente detrás del menú al abrirse */
  .sidebar-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1050;
  }

  .sidebar-overlay.active {
    display: block;
  }
}
:root{
  --navy:#0E2233;
  --navy-2:#123049;
  --deck:#F2F6F8;
  --panel:#FFFFFF;
  --line-blue:#1C7FA6;
  --line-blue-dark:#0F6486;
  --live:#E8543A;
  --gold:#B8912B;
  --silver:#8C97A1;
  --bronze:#AD6A2E;
  --ink:#0F1F2B;
  --ink-2:#3C5064;
  --muted:#7288A2;
  --border:#DCE6EB;
  --border-2:#EDF2F5;
  --ok:#1E8F6B;
  --warn:#C1531E;
  --radius:10px;
  --font-d:'Space Grotesk',sans-serif;
  --font-b:'IBM Plex Sans',sans-serif;
  --pob-navy:#123049;
  --pob-orange:#D97A1F;
  --pob-green:#5C7A3E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-b);
  color:var(--ink);
  background:var(--deck);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::selection{background:var(--line-blue);color:#fff;}
.app{display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{
  width:260px;flex:0 0 260px;
  background:var(--navy);
  color:#CBD9E3;
  display:flex;flex-direction:column;
  transition:width .22s ease, flex-basis .22s ease;
  position:relative;z-index:20;
}
.sidebar.collapsed{width:72px;flex-basis:72px;}
.sb-head{
  display:flex;align-items:center;gap:10px;
  padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08);
  min-height:64px;
}
.sb-mark{
  width:36px;height:36px;border-radius:9px;flex:0 0 36px;
  background:linear-gradient(155deg,var(--line-blue),var(--line-blue-dark));
  display:flex;align-items:center;justify-content:center;
}
.sb-title{font-family:var(--font-d);font-weight:700;font-size:15px;color:#fff;line-height:1.15;white-space:nowrap;overflow:hidden;}
.sb-title small{display:block;font-family:var(--font-b);font-weight:500;font-size:11px;color:#7EA1B7;letter-spacing:.01em;}
.sidebar.collapsed .sb-title{display:none;}
.sb-toggle{
  margin-left:auto;background:transparent;border:0;color:#8FADBF;
  width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 28px;
}
.sb-toggle:hover{background:rgba(255,255,255,.08);color:#fff;}
.sidebar.collapsed .sb-head{padding:18px 0;justify-content:center;}
.sidebar.collapsed .sb-toggle{margin-left:0;}

.nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;border-radius:8px;border:0;background:transparent;
  color:#AEC3D2;text-align:left;font-size:13px;font-weight:500;
  white-space:nowrap;overflow:hidden;
}
.nav-item svg{flex:0 0 18px;width:18px;height:18px;}
.nav-item span{overflow:hidden;text-overflow:ellipsis;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(28,127,166,.28);color:#fff;box-shadow:inset 3px 0 0 var(--line-blue);}
.sidebar.collapsed .nav-item{justify-content:center;padding:11px 0;}
.sidebar.collapsed .nav-item span{display:none;}

.sb-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#6E8EA2;}
.sb-foot .live-row{display:flex;align-items:center;gap:7px;margin-bottom:6px;color:#B9CCD8;font-weight:500;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);flex:0 0 7px;}
.dot.pulse{animation:pulse 1.6s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,84,58,.55);}70%{box-shadow:0 0 0 6px rgba(232,84,58,0);}100%{box-shadow:0 0 0 0 rgba(232,84,58,0);}}
.sidebar.collapsed .sb-foot{display:none;}
.gear-btn{background:transparent;border:1px solid rgba(255,255,255,.15);color:#9CC2D6;border-radius:7px;padding:6px 8px;font-size:11.5px;display:flex;align-items:center;gap:6px;width:100%;justify-content:center;margin-top:6px;}
.gear-btn:hover{background:rgba(255,255,255,.08);color:#fff;}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--panel);border-bottom:1px solid var(--border);
  padding:16px 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  position:sticky;top:0;z-index:10;
}
.topbar h1{font-family:var(--font-d);font-size:21px;margin:0 0 3px;color:var(--navy);letter-spacing:-.01em;}
.topbar p{margin:0;color:var(--muted);font-size:12.5px;}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn{
  display:flex;align-items:center;gap:7px;
  border:1px solid var(--border);background:#fff;color:var(--ink-2);
  padding:8px 13px;border-radius:8px;font-size:12.5px;font-weight:600;
}
.btn svg{width:15px;height:15px;flex:0 0 15px;}
.btn:hover{border-color:var(--line-blue);color:var(--line-blue-dark);background:#F3FAFD;}
.btn.primary{background:var(--line-blue);border-color:var(--line-blue);color:#fff;}
.btn.primary:hover{background:var(--line-blue-dark);}
.btn.ghost{border-color:transparent;background:transparent;}
.btn:disabled{opacity:.45;cursor:default;}
.btn:disabled:hover{border-color:var(--border);color:var(--ink-2);background:#fff;}

.content{padding:22px 26px 60px;flex:1;}
.page{display:none;}
.page.active{display:block;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

.filters-bar{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:16px;
}
.filter-group{display:flex;flex-direction:column;gap:4px;}
.filter-group label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.filter-group select, .filter-group input[type=text]{
  border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:13px;color:var(--ink);
  background:#fff;min-width:130px;
}
.filter-group select:focus, .filter-group input:focus{outline:2px solid var(--line-blue);outline-offset:1px;}
.search-wrap{position:relative;margin-left:auto;}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);}
.search-wrap input{padding-left:29px !important;min-width:210px !important;}

/* KPIS */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px;}
.kpi{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;position:relative;overflow:hidden;
}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-blue);}
.kpi .n{font-family:var(--font-d);font-size:24px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.2;}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;}
.kpi.fem::before{background:#C15E86;}
.kpi.masc::before{background:var(--line-blue);}
.kpi.gold::before{background:var(--gold);}
.kpi.silver::before{background:var(--silver);}
.kpi.bronze::before{background:var(--bronze);}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.table-wrap{overflow:auto;max-height:68vh;}
table.data{width:100%;border-collapse:collapse;font-size:13px;}
table.data thead th{
  position:sticky;top:0;background:#F7FAFB;border-bottom:1px solid var(--border);
  text-align:left;padding:10px 12px;font-size:11px;font-weight:700;color:var(--ink-2);
  text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;user-select:none;z-index:2;
}
table.data tbody td{padding:9px 12px;border-bottom:1px solid var(--border-2);white-space:nowrap;color:var(--ink);}
table.data tbody tr:hover{background:#F5FAFC;}

/* TABLAS ESPEJO DE POBLACIÓN */
table.sheet-mirror{width:100%;border-collapse:collapse;font-size:13.5px;}
table.sheet-mirror th{
  padding:10px 14px;text-align:center;font-weight:700;color:#fff;
  white-space:nowrap;font-size:12.5px;border-right:1px solid rgba(255,255,255,.14);
}
table.sheet-mirror th:first-child{text-align:left;}
table.sheet-mirror th:last-child{border-right:0;}
table.sheet-mirror td{
  padding:10px 14px;text-align:center;border-bottom:1px solid var(--border-2);
  border-right:1px solid var(--border-2);font-variant-numeric:tabular-nums;
}
table.sheet-mirror td:first-child{text-align:left;}
table.sheet-mirror td:last-child{border-right:0;}
table.sheet-mirror.head-navy th{background:var(--pob-navy);}
table.sheet-mirror.head-orange th{background:var(--pob-orange);}
table.sheet-mirror.head-green th{background:var(--pob-green);}
table.sheet-mirror tbody tr.value-row td{font-weight:700;font-size:15px;color:var(--navy);}
table.sheet-mirror tbody tr:last-child td{border-bottom:0;}
tr.cat-row td{font-weight:700;color:var(--ink);background:#F7F9F6;}
tr.cat-row td:first-child{color:var(--ink);}
tr.age-row td:first-child{padding-left:28px;color:var(--muted);font-weight:400;}
tr.age-row td{color:var(--ink-2);}
.poblacion-block{margin-bottom:28px;}
.poblacion-block h3{
  font-family:var(--font-d);font-size:14px;font-weight:700;margin:0 0 10px;color:var(--navy);
  text-transform:uppercase;letter-spacing:.03em;
}

.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.tag.gold{background:#F5EAC7;color:#8A6B10;}
.tag.silver{background:#E9ECEE;color:#5A6670;}
.tag.bronze{background:#F1DFCB;color:#8A4E15;}
.tag.dq{background:#FBE4DC;color:var(--warn);}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);}
.empty-state svg{width:38px;height:38px;color:#B9C9D3;margin-bottom:10px;}
.empty-state b{color:var(--ink-2);display:block;margin-bottom:4px;font-size:14px;}
.loading-row{padding:40px;text-align:center;color:var(--muted);font-size:13px;}
.foot-note{padding:9px 14px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--border-2);background:#FAFCFD;}

/* MODAL CONFIG */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,28,.5);display:none;align-items:center;justify-content:center;z-index:100;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:12px;padding:22px;width:440px;max-width:92vw;max-height:86vh;overflow:auto;}
.modal h3{font-family:var(--font-d);margin:0 0 4px;color:var(--navy);}
.modal p{margin:0 0 16px;color:var(--muted);font-size:12.5px;}
.mrow{display:flex;flex-direction:column;gap:4px;margin-bottom:11px;}
.mrow label{font-size:11.5px;font-weight:700;color:var(--ink-2);}
.mrow input{border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}

@media (max-width:880px){
  .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);width:240px;flex-basis:240px;box-shadow:0 0 30px rgba(0,0,0,.3);}
  .sidebar.mobile-open{transform:translateX(0);}
  .sidebar.collapsed{width:240px;flex-basis:240px;}
  .sidebar.collapsed .sb-title{display:block;}
  .sidebar.collapsed .nav-item span{display:inline;}
  .content{padding:16px;}
  .topbar{padding:12px 16px;}
}
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-mark">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M2 17c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 3 1.3 4.5 0 3-1.3 4.5 0"/><path d="M2 12c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 3 1.3 4.5 0 3-1.3 4.5 0"/><circle cx="17" cy="5" r="2"/><path d="M11 9l-5 2 1.5 2.5"/></svg>
      </div>
      <div class="sb-title">Panel de Torneo<small>Resultados en vivo</small></div>
      <button class="sb-toggle" id="sbToggle" title="Contraer/expandir menú">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
    
    <nav class="nav" id="navList"></nav>

    <div class="sb-foot">
      <div class="live-row"><span class="dot pulse"></span><span>Google Sheets Conectado</span></div>
      <div id="lastUpdated">Sin cargar aún</div>
      <button class="gear-btn" id="settingsBtn">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008.6 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 003.6 8.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H8a1.65 1.65 0 001-1.51V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V8c.51.19 1.05.3 1.51 1H22a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Configurar Pestañas
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Población</h1>
        <p id="pageSubtitle">Resumen de nadadores inscritos y categorías</p>
      </div>
      <div class="toolbar">
        <button class="btn" id="btnRefresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          Actualizar
        </button>
        <button class="btn" id="btnExcel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>Excel</button>
        <button class="btn" id="btnPdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>PDF</button>
        <button class="btn" id="btnCopy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copiar</button>
      </div>
    </div>

    <div class="content" id="content"></div>
  </div>
</div>

<!-- MODAL CONFIG -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Configuración de Pestañas</h3>
    <p>Nombres exactos de las pestañas en tu Google Sheet.</p>
    <div class="mrow"><label>ID de la hoja de cálculo</label><input id="cfgSheetId" type="text"></div>
    <div class="mrow"><label>Población</label><input id="cfgPoblacion" type="text"></div>
    <div class="mrow"><label>Medallas (Equipos)</label><input id="cfgMedallas" type="text"></div>
    <div class="mrow"><label>Puntaje (Equipos)</label><input id="cfgPuntaje" type="text"></div>
    <div class="mrow"><label>Ind (Pruebas Individuales)</label><input id="cfgInd" type="text"></div>
    <div class="mrow"><label>PuntosInd</label><input id="cfgPuntosInd" type="text"></div>
    <div class="mrow"><label>MedInd (Medallas por Nadador)</label><input id="cfgMedInd" type="text"></div>
    <div class="mrow"><label>Marca Tecnica</label><input id="cfgMarcaTec" type="text"></div>
    <div class="mrow"><label>MedallasCat (Por Categoría)</label><input id="cfgMedCat" type="text"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="cfgCancel">Cancelar</button>
      <button class="btn primary" id="cfgApply">Guardar y Recargar</button>
    </div>
  </div>
</div>

<script>
const CFG = {
  sheetId: '1P9seDPZXSESSk7CvMxgNlx2oM2w71bNrC1eA08Rcr2o',
  poblacion: 'Poblacion',
  medallas: 'Medallas',
  puntaje: 'Puntaje',
  ind: 'Ind',
  puntosInd: 'PuntosInd',
  medInd: 'MedInd',
  marcaTecnica: 'Marca Tecnica',
  medallasCat: 'MedallasCat'
};

const PAGES = [
  { id: 'poblacion', label: 'Población', subtitle: 'Resumen de nadadores inscritos y categorías', icon: 'users', tabKey: 'poblacion' },
  { id: 'medallas', label: 'Medallas', subtitle: 'Medallero general por equipos', icon: 'medal', tabKey: 'medallas' },
  { id: 'puntaje', label: 'Puntaje', subtitle: 'Clasificación general de puntos por equipo', icon: 'trophy', tabKey: 'puntaje' },
  { id: 'ind', label: 'Ind', subtitle: 'Resultados detallados por prueba individual', icon: 'swim', tabKey: 'ind' },
  { id: 'puntos_ind', label: 'PuntosInd', subtitle: 'Puntaje acumulado por nadador', icon: 'star', tabKey: 'puntosInd' },
  { id: 'med_ind', label: 'MedInd', subtitle: 'Medallas acumuladas por nadador', icon: 'award', tabKey: 'medInd' },
  { id: 'marca_tecnica', label: 'Marca Técnica', subtitle: 'Mejores marcas técnicas y Puntos WA', icon: 'zap', tabKey: 'marcaTecnica' },
  { id: 'medallas_cat', label: 'MedallasCat', subtitle: 'Distribución de medallas por categoría', icon: 'layers', tabKey: 'medallasCat' }
];

const ICONS = {
  users:'<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 014-4h6a4 4 0 014 4v2"/><path d="M17 3.13a4 4 0 010 7.75"/><path d="M22 21v-2a4 4 0 00-3-3.87"/>',

const STATE = { currentPage: 'poblacion', exportRows: [], exportColumns: [], exportFilename: 'datos' };
const cacheRaw = {};
const cacheHeader = {};

function norm(s){ return (s===undefined||s===null) ? '' : String(s).trim(); }
function stripAccents(s){ return norm(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function escapeHtml(s){ return norm(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function csvUrl(tabName){
  return `https://docs.google.com/spreadsheets/d/${CFG.sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
}

// 1. Lectura de datos sin que Google altere o suprima encabezados secundarios
async function fetchRawTab(tabName, force=false){
  if(cacheRaw[tabName] && !force) return cacheRaw[tabName];
  
  // Se añade &headers=0 y fallback a export?format=csv para mantener la estructura cruda de filas
  const url = `https://docs.google.com/spreadsheets/d/${CFG.sheetId}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(tabName)}`;
  
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error(`HTTP ${res.status} al intentar leer "${tabName}"`);
  const text = await res.text();
  const parsed = Papa.parse(text.trim(), {header:false, skipEmptyLines:false});
  cacheRaw[tabName] = parsed.data || [];
  return cacheRaw[tabName];
}

function findKey(row, candidates){
  if(!row) return null;
  const keys = Object.keys(row);
  for(const c of candidates){
    const hit = keys.find(k => stripAccents(k) === stripAccents(c));
    if(hit) return hit;
  }
  for(const c of candidates){
    const hit = keys.find(k => stripAccents(k).includes(stripAccents(c)));
    if(hit) return hit;
  }
  return null;
}

async function renderPoblacionPage() {
  const el = document.getElementById('page-poblacion');
  if (!el) return;
  el.innerHTML = `<div class="loading-row">Cargando datos de Población...</div>`;

  try {
    const rawData = await fetchRawTab(CFG.poblacion);
    if (!rawData || rawData.length === 0) {
      el.innerHTML = `<div class="empty-state">${icon('empty')}<b>Sin datos disponibles</b>No se encontraron datos en la pestaña "${escapeHtml(CFG.poblacion)}".</div>`;
      return;
    }

    const str = (v) => (v === undefined || v === null) ? '' : String(v).trim();
    const normStr = (v) => stripAccents(str(v));

    // Filtrar filas completamente vacías
    const validRows = rawData.filter(r => r && r.some(c => str(c) !== ''));

    // Encabezados predeterminados de respaldo
    const HEADERS_T1 = ["Equipos", "Damas", "Varones", "Nadadores", "Pruebas", "Mejoró", "DQ", "NS", "MMIC"];
    const HEADERS_T2 = ["Equipos", "Damas", "Varones", "Nadadores", "Pruebas", "Mejoró", "DQ", "NS", "MMIC"];
    const HEADERS_T3 = ["CATEGORÍAS", "DAMAS", "VARONES", "NADADORES", "PRUEBAS", "MEJORÓ", "DQ", "NS", "MMIC"];

    // Completa con el valor de respaldo si la celda leída viene vacía
    const buildHeaders = (row, defaults) => {
      return defaults.map((def, idx) => {
        const val = row && row[idx] !== undefined ? str(row[idx]) : '';
        return val !== '' ? val : def;
      });
    };

    let html = `<div class="poblacion-wrapper">`;

    // -------------------------------------------------------------------------
    // TABLA 1: Población General del Torneo
    // -------------------------------------------------------------------------
    const t1HeaderIdx = validRows.findIndex(r => normStr(r[0]) === 'equipos' || normStr(r[0]).includes('equipo'));
    if (t1HeaderIdx !== -1 && t1HeaderIdx + 1 < validRows.length) {
      const t1Headers = buildHeaders(validRows[t1HeaderIdx], HEADERS_T1);
      const t1Values = validRows[t1HeaderIdx + 1].slice(0, 9);

      html += `<div class="poblacion-block">`;
      html += `<h3>Población General del Torneo</h3>`;
      html += `<div class="panel"><div class="table-wrap"><table class="sheet-mirror head-navy"><thead><tr>`;
      t1Headers.forEach(h => { html += `<th>${escapeHtml(h)}</th>`; });
      html += `</tr></thead><tbody><tr class="value-row">`;
      t1Headers.forEach((_, i) => { html += `<td>${escapeHtml(str(t1Values[i]) || '0')}</td>`; });
      html += `</tr></tbody></table></div>`;
      html += `<div class="foot-note">Fuente: Pestaña “${escapeHtml(CFG.poblacion)}” (Fila 1 a 2)</div></div></div>`;
    }

    // -------------------------------------------------------------------------
    // TABLA 2: Población Equipo
    // -------------------------------------------------------------------------
    const t2HeaderIdx = validRows.findIndex((r, idx) => idx > t1HeaderIdx && normStr(r[0]) === 'equipo');
    if (t2HeaderIdx !== -1 && t2HeaderIdx + 1 < validRows.length) {
      const t2Headers = buildHeaders(validRows[t2HeaderIdx], HEADERS_T2);
      const t2Values = validRows[t2HeaderIdx + 1].slice(0, 9);

      html += `<div class="poblacion-block">`;
      html += `<h3>Población Equipo</h3>`;
      html += `<div class="panel"><div class="table-wrap"><table class="sheet-mirror head-orange"><thead><tr>`;
      t2Headers.forEach(h => { html += `<th>${escapeHtml(h)}</th>`; });
      html += `</tr></thead><tbody><tr class="value-row">`;
      t2Headers.forEach((_, i) => { html += `<td>${escapeHtml(str(t2Values[i]) || '0')}</td>`; });
      html += `</tr></tbody></table></div>`;
      html += `<div class="foot-note">Fuente: Pestaña “${escapeHtml(CFG.poblacion)}” (Fila 4 a 5)</div></div></div>`;
    }

    // -------------------------------------------------------------------------
    // TABLA 3: Delegación Equipo
    // -------------------------------------------------------------------------
    const t3HeaderIdx = validRows.findIndex(r => normStr(r[0]).includes('categoria') || normStr(r[1]) === 'damas');
    if (t3HeaderIdx !== -1) {
      const t3Headers = buildHeaders(validRows[t3HeaderIdx], HEADERS_T3);
      const t3Rows = validRows.slice(t3HeaderIdx + 1);

      html += `<div class="poblacion-block">`;
      html += `<h3>Delegación Equipo</h3>`;
      html += `<div class="panel"><div class="table-wrap"><table class="sheet-mirror head-green"><thead><tr>`;
      t3Headers.forEach(h => { html += `<th>${escapeHtml(h)}</th>`; });
      html += `</tr></thead><tbody>`;

      const mainCats = ['INFANTIL A', 'INFANTIL B', 'JUVENIL A', 'JUVENIL B', 'JUNIOR', 'MAYORES', 'TOTAL'];

      t3Rows.forEach(row => {
        const firstCell = str(row[0]);
        if (!firstCell) return;
        const isMainCat = mainCats.some(mc => firstCell.toUpperCase().includes(mc));
        html += `<tr class="${isMainCat ? 'cat-row' : 'age-row'}">`;
        t3Headers.forEach((_, c) => {
          const val = str(row[c]);
          html += `<td>${c === 0 ? escapeHtml(val) : escapeHtml(val === '' ? '0' : val)}</td>`;
        });
        html += `</tr>`;
      });

      html += `</tbody></table></div>`;
      html += `<div class="foot-note">Fuente: Pestaña “${escapeHtml(CFG.poblacion)}” (Fila 7 a 26)</div></div></div>`;
    }

    html += `</div>`;
    el.innerHTML = html;

  } catch(e) {
    el.innerHTML = `<div class="empty-state">${icon('empty')}<b>Error al cargar</b>${escapeHtml(e.message)}</div>`;
  }
}
  
/* =====================================================================
   TABLAS GENÉRICAS DE OTRAS PESTAÑAS
===================================================================== */
function buildDataTable(container, {rows, columns, sortKey, sortDir='asc', onSort, rowClassFn}){
  if(!rows || rows.length===0){
    container.innerHTML = `<div class="empty-state">${icon('empty')}<b>Sin datos disponibles</b></div>`;
    return;
  }
  let html = '<div class="table-wrap"><table class="data"><thead><tr>';
  columns.forEach(c=>{
    const sorted = c.key===sortKey;
    html += `<th data-key="${c.key}" class="${sorted?'sorted':''}">${escapeHtml(c.label)}<span class="arrow">${sorted ? (sortDir==='asc'?'▲':'▼') : '↕'}</span></th>`;
  });
  html += '</tr></thead><tbody>';
  rows.forEach(row=>{
    const cls = rowClassFn ? rowClassFn(row) : '';
    html += `<tr class="${cls}">`;
    columns.forEach(c=>{
      const raw = row[c.key];
      const val = c.render ? c.render(raw, row) : escapeHtml(raw);
      html += `<td class="${c.mono?'mono':''}">${val==='' || val===undefined ? '—' : val}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  container.innerHTML = html;
  container.querySelectorAll('thead th').forEach(th=>{
    th.addEventListener('click', ()=> onSort(th.dataset.key));
  });
}

function sortRows(rows, key, dir, columns){
  const colDef = columns.find(c=>c.key===key);
  return [...rows].sort((a,b)=>{
    let av = a[key], bv = b[key];
    const an = parseFloat(norm(av).replace(',', '.').replace(/[^0-9.\-]/g,''));
    const bn = parseFloat(norm(bv).replace(',', '.').replace(/[^0-9.\-]/g,''));
    const bothNum = !isNaN(an) && !isNaN(bn) && (colDef && colDef.numeric);
    let cmp = bothNum ? (an - bn) : norm(av).localeCompare(norm(bv), 'es', {numeric:true, sensitivity:'base'});
    return dir==='asc' ? cmp : -cmp;
  });
}

function setExport(rows, columns, filename){
  STATE.exportRows = rows;
  STATE.exportColumns = columns;
  STATE.exportFilename = filename;
  const hasData = rows && rows.length > 0;
  document.getElementById('btnExcel').disabled = !hasData;
  document.getElementById('btnPdf').disabled = !hasData;
  document.getElementById('btnCopy').disabled = !hasData;
}

async function renderGenericTab(pageConfig){
  const { id: pageId, tabKey } = pageConfig;
  const tabName = CFG[tabKey];
  const el = document.getElementById('page-' + pageId);
  el.innerHTML = `<div class="loading-row">Cargando "${escapeHtml(tabName)}"...</div>`;
  
  try {
    const rows = await fetchHeaderTab(tabName);
    if(!rows || rows.length === 0){
      el.innerHTML = `<div class="empty-state">${icon('empty')}<b>La pestaña "${escapeHtml(tabName)}" está vacía</b></div>`;
      setExport([], [], pageId);
      return;
    }
    
    const sample = rows[0];
    const genderKey = findKey(sample, ['genero','género','sexo']);
    const categoryKey = findKey(sample, ['categoria','categoría','cat']);
    const teamKey = findKey(sample, ['equipo','club','delegacion']);
    const pruebaKey = findKey(sample, ['prueba','evento']);
    const lugarKey = findKey(sample, ['lugar','puesto','posicion']);

    let filtersHtml = '<div class="filters-bar">';
    if(genderKey) filtersHtml += `<div class="filter-group"><label>Género</label><select id="${pageId}Gender"><option value="">Todos</option></select></div>`;
    if(categoryKey) filtersHtml += `<div class="filter-group"><label>Categoría</label><select id="${pageId}Category"><option value="">Todas</option></select></div>`;
    if(teamKey) filtersHtml += `<div class="filter-group"><label>Equipo/Club</label><select id="${pageId}Team"><option value="">Todos</option></select></div>`;
    if(pruebaKey) filtersHtml += `<div class="filter-group"><label>Prueba</label><select id="${pageId}Prueba"><option value="">Todas</option></select></div>`;
    filtersHtml += `<div class="search-wrap">${icon('search')}<input type="text" id="${pageId}Search" placeholder="Buscar en datos..."></div></div>`;
    
    filtersHtml += `<div class="kpi-row" id="${pageId}Kpis"></div>`;
    filtersHtml += `<div class="panel"><div id="${pageId}Table"></div><div class="foot-note">Fuente: Pestaña “${escapeHtml(tabName)}” · ${rows.length} registros cargados.</div></div>`;

    el.innerHTML = filtersHtml;

    if(genderKey){
      const opts = [...new Set(rows.map(r=>norm(r[genderKey])).filter(Boolean))].sort();
      document.getElementById(`${pageId}Gender`).innerHTML = '<option value="">Todos</option>' + opts.map(o=>`<option>${escapeHtml(o)}</option>`).join('');
    }
    if(categoryKey){
      const opts = [...new Set(rows.map(r=>norm(r[categoryKey])).filter(Boolean))].sort();
      document.getElementById(`${pageId}Category`).innerHTML = '<option value="">Todas</option>' + opts.map(o=>`<option>${escapeHtml(o)}</option>`).join('');
    }
    if(teamKey){
      const opts = [...new Set(rows.map(r=>norm(r[teamKey])).filter(Boolean))].sort();
      document.getElementById(`${pageId}Team`).innerHTML = '<option value="">Todos</option>' + opts.map(o=>`<option>${escapeHtml(o)}</option>`).join('');
    }
    if(pruebaKey){
      const opts = [...new Set(rows.map(r=>norm(r[pruebaKey])).filter(Boolean))].sort();
      document.getElementById(`${pageId}Prueba`).innerHTML = '<option value="">Todas</option>' + opts.map(o=>`<option>${escapeHtml(o)}</option>`).join('');
    }

    const rawKeys = Object.keys(sample);
    const columns = rawKeys.map(k => {
      const kClean = stripAccents(k);
      const isNum = ['lugar','puesto','puntos','oro','plata','bronce','total','edad','pwa'].some(h=>kClean.includes(h));
      return {
        key: k,
        label: k,
        numeric: isNum,
        mono: isNum || kClean.includes('tiempo') || kClean.includes('marca'),
        render: (v) => {
          const valStr = norm(v);
          if(kClean === 'lugar' || kClean === 'puesto'){
            if(valStr==='1') return `<span class="tag gold">🥇 1</span>`;
            if(valStr==='2') return `<span class="tag silver">🥈 2</span>`;
            if(valStr==='3') return `<span class="tag bronze">🥉 3</span>`;
          }
          if(valStr.toUpperCase() === 'DQ') return `<span class="tag dq">DQ</span>`;
          return escapeHtml(valStr);
        }
      };
    });

    const defaultSortKey = lugarKey || rawKeys[0];
    const sortState = { key: defaultSortKey, dir: 'asc' };

    function applyFilters(){
      let filtered = [...rows];
      if(genderKey){ const g = document.getElementById(`${pageId}Gender`).value; if(g) filtered = filtered.filter(r=>norm(r[genderKey])===g); }
      if(categoryKey){ const c = document.getElementById(`${pageId}Category`).value; if(c) filtered = filtered.filter(r=>norm(r[categoryKey])===c); }
      if(teamKey){ const t = document.getElementById(`${pageId}Team`).value; if(t) filtered = filtered.filter(r=>norm(r[teamKey])===t); }
      if(pruebaKey){ const p = document.getElementById(`${pageId}Prueba`).value; if(p) filtered = filtered.filter(r=>norm(r[pruebaKey])===p); }
      
      const q = stripAccents(document.getElementById(`${pageId}Search`).value);
      if(q){
        filtered = filtered.filter(r => Object.values(r).some(v => stripAccents(v).includes(q)));
      }

      renderKPIs(pageId, filtered, sample);
      filtered = sortRows(filtered, sortState.key, sortState.dir, columns);

      buildDataTable(document.getElementById(`${pageId}Table`), {
        rows: filtered,
        columns,
        sortKey: sortState.key,
        sortDir: sortState.dir,
        onSort: (k)=>{
          sortState.dir = (sortState.key===k && sortState.dir==='asc') ? 'desc' : 'asc';
          sortState.key = k;
          applyFilters();
        }
      });

      setExport(filtered, columns, `${pageId}_${tabName.toLowerCase()}`);
    }

    ['Gender','Category','Team','Prueba','Search'].forEach(fId=>{
      const elF = document.getElementById(`${pageId}${fId}`);
      if(elF){
        elF.addEventListener('input', applyFilters);
        elF.addEventListener('change', applyFilters);
      }
    });

    applyFilters();

  } catch(e) {
    el.innerHTML = `<div class="empty-state">Error al cargar "${escapeHtml(tabName)}": ${escapeHtml(e.message)}</div>`;
  }
}

function renderKPIs(pageId, filtered, sample){
  const kpiCont = document.getElementById(`${pageId}Kpis`);
  if(!kpiCont) return;

  const totalReg = filtered.length;
  let html = `<div class="kpi"><div class="n">${totalReg}</div><div class="l">Registros</div></div>`;

  const goldKey = findKey(sample, ['oro','gold']);
  const silverKey = findKey(sample, ['plata','silver']);
  const bronzeKey = findKey(sample, ['bronce','bronze']);
  const puntosKey = findKey(sample, ['puntos','puntaje']);

  if(goldKey || silverKey || bronzeKey){
    const goldSum = goldKey ? filtered.reduce((a,b)=>a+(parseInt(norm(b[goldKey]),10)||0),0) : 0;
    const silverSum = silverKey ? filtered.reduce((a,b)=>a+(parseInt(norm(b[silverKey]),10)||0),0) : 0;
    const bronzeSum = bronzeKey ? filtered.reduce((a,b)=>a+(parseInt(norm(b[bronzeKey]),10)||0),0) : 0;
    html += `<div class="kpi gold"><div class="n">${goldSum}</div><div class="l">Oro</div></div>`;
    html += `<div class="kpi silver"><div class="n">${silverSum}</div><div class="l">Plata</div></div>`;
    html += `<div class="kpi bronze"><div class="n">${bronzeSum}</div><div class="l">Bronce</div></div>`;
  } else if(puntosKey){
    const totalPuntos = filtered.reduce((a,b)=>a+(parseFloat(norm(b[puntosKey]))||0),0);
    html += `<div class="kpi gold"><div class="n">${totalPuntos.toLocaleString('es-CO')}</div><div class="l">Total Puntos</div></div>`;
  }

  kpiCont.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', () => {
  // Ajusta los selectores (.btn-menu, .sidebar) según los nombres exactos en tu HTML
  const menuBtn = document.querySelector('.btn-menu, .menu-toggle, [data-toggle="sidebar"]');
  const sidebar = document.querySelector('.sidebar, nav');
  
  if (!sidebar) return;

  // Crear el overlay si no existe en el DOM
  let overlay = document.querySelector('.sidebar-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.className = 'sidebar-overlay';
    document.body.appendChild(overlay);
  }

  // Función para abrir/cerrar
  const toggleSidebar = () => {
    sidebar.classList.toggle('active');
    overlay.classList.toggle('active');
  };

  // Evento al presionar el botón de hamburguesa
  if (menuBtn) {
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleSidebar();
    });
  }

  // Cerrar al hacer clic en el fondo oscuro
  overlay.addEventListener('click', toggleSidebar);

  // Cerrar automáticamente al seleccionar una opción de la lista en móviles
  const menuLinks = sidebar.querySelectorAll('a, button, .nav-item');
  menuLinks.forEach(link => {
    link.addEventListener('click', () => {
      if (window.innerWidth <= 768 && sidebar.classList.contains('active')) {
        toggleSidebar();
      }
    });
  });
});
</script>
